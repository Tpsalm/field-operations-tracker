services:
  - type: web
    name: kea-operations-suite
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: kea-workflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKFLOW_DATA_DIR
        value: /var/data
